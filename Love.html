* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #ffb6d5 0%, transparent 30%),

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
    overflow-x: hidden;
}

/* Uçuşan kalpler */

.hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.heart {
    position: absolute;
    bottom: -60px;
    font-size: 25px;

    animation: fly 8s linear infinite;
    opacity: 0;
}

@keyframes fly {

    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}


/* Ana kutu */

.container {
    width: 92%;
    max-width: 520px;

    padding: 30px;

    text-align: center;

    background: rgba(255,255,255,0.18);

    backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,0.35);

    border-radius: 30px;

    box-shadow:
        0 15px 40px rgba(100,0,40,0.25);

    position: relative;

    z-index: 2;
}


/* Başlık */

h1 {
    font-size: 32px;
    margin-bottom: 15px;
}

.subtitle {
    font-size: 18px;
    line-height: 1.6;
}


/* Butonlar */

button {
    border: none;

    background: white;

    color: #e91e63;

    padding: 14px 24px;

    border-radius: 30px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 12px;

    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}


/* Quiz */

#quiz,
#result {
    display: none;
}

.question-number {
    font-size: 15px;
    opacity: 0.9;
}

.question {
    font-size: 21px;

    font-weight: bold;

    line-height: 1.5;

    margin: 20px 0;
}


/* Şıklar */

.option {
    display: block;

    width: 100%;

    margin: 10px 0;

    background: rgba(255,255,255,0.95);

    color: #d81b60;
}

.option:hover {
    background: white;
}


/* Sonuç */

.score {
    font-size: 30px;

    font-weight: bold;

    margin: 20px 0;
}

.message {

    background: rgba(255,255,255,0.18);

    border-radius: 20px;

    padding: 22px;

    line-height: 1.8;

    font-size: 18px;
}


/* Büyük kalp */

.big-heart {

    font-size: 50px;

    animation: beat 1s infinite;
}

@keyframes beat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}


/* Müzik butonu */

    right: 20px;

    height: 48px;

/* =========================
   QUIZ SİSTEMİ
========================= */

let current = 0;

let score = 0;


/* Quiz başlat */

function startQuiz() {

    document.getElementById("start").style.display =
        "none";

    document.getElementById("quiz").style.display =
        "block";


    /* Müziği başlat */

    const music =
        document.getElementById("loveMusic");


    music.volume = 0.9;


    music.play().then(() => {

        document.getElementById("musicButton")
            .innerText = "🔊";

    }).catch(() => {

        document.getElementById("musicButton")
            .innerText = "🔇";

    });


    showQuestion();
}


/* Soru göster */

function showQuestion() {

    const q = questions[current];


    document.getElementById("questionNumber")
        .innerText =
        `${current + 1} / ${questions.length}`;


    document.getElementById("question")
        .innerText =
        q.q;


    const options =
        document.getElementById("options");


    options.innerHTML = "";


    q.options.forEach((option, index) => {

        const button =
            document.createElement("button");


        button.className =
            "option";


        button.innerText =
            option;


        button.onclick = function() {


            if (index === q.answer) {

                score++;

            }


            current++;


            if (current < questions.length) {

                showQuestion();

            }

            else {

                showResult();

            }

        };


        options.appendChild(button);

    });

}


/* Sonuç */

function showResult() {

    document.getElementById("quiz")
        .style.display = "none";


    document.getElementById("result")
        .style.display = "block";


    document.getElementById("score")
        .innerText =
        `${score} / ${questions.length} ❤️`;

}


/* =========================
   MÜZİK AÇ / KAPAT
========================= */

function toggleMusic() {

    const music =
        document.getElementById("loveMusic");


    const button =
        document.getElementById("musicButton");


    if (music.paused) {

        music.play();

        music.volume = 0.25;

        button.innerText = "🔊";

    }

    else {

        music.pause();

        button.innerText = "🔇";

    }

}
